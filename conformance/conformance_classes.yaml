manifest_version: 1
zmeta_versions:
  - "1.0"
  - "1.1.0-experimental"
authority: spec/semantics-contract.md
last_updated: "2026-05-07"
status_values:
  - implemented
  - partially_implemented
  - planned
  - reserved
  - future
  - deprecated
non_claimable_statuses:
  - planned
  - reserved
  - future
claim_status_values:
  - claimed
  - partial
  - not_claimed
  - not_applicable
claim_model:
  required_fields:
    - implementation_name
    - implementation_type
    - implementation_version
    - zmeta_versions_supported
    - classes_claimed
    - class_claims
    - test_commands_run
    - test_results
    - schema_versions
    - policy_pack_versions
    - extension_registry_version
    - projection_catalog_version
    - contract_hash
    - commit_hash
    - date
    - claim_owner
    - limitations
    - exceptions
  dependency_policy: claims_must_include_dependency_closure
  hash_policy: contract_hash may be pending_D-002 until D-002 is resolved
  result_policy: required commands for each claimed class must be recorded as passed
notes:
  - Conformance classes do not create semantics or make future vocabulary valid.
  - v1.1.0 support remains experimental until a separate release decision promotes it.
  - Example claims are reproducible examples, not release certificates.

defaults:
  class: &class_defaults
    semantic_contract_sections: []
    required_schema_surfaces: []
    required_policy_surfaces: []
    required_gateway_surfaces: []
    required_adapter_surfaces: []
    required_encoding_surfaces: []
    required_conformance_fixtures: []
    required_test_commands: []
    dependencies: []
    exclusions: []
    allowed_claimants: []
    claim_evidence_required:
      - test_commands_run
      - test_results
      - schema_versions
      - policy_pack_versions
      - extension_registry_version
      - projection_catalog_version
      - contract_hash
      - commit_hash
      - limitations
      - exceptions
    current_repo_support: not_applicable
    future_or_reserved_notes: []
    extension_registry_dependencies: []
    references:
      - spec/conformance-classes.md
      - docs/s1_04_conformance_class_manifest_plan.md

class_records:
  - <<: *class_defaults
    class_id: ZMETA-CORE
    display_name: ZMeta Core Semantics
    status: implemented
    version_scope: ["1.0"]
    description: Core v1.0 envelope, event families, discriminator consistency, identity, UTC-Z time, units, confidence, lineage, and layer separation.
    semantic_contract_sections: ["Core event semantics", "Authority boundaries", "Lineage and confidence"]
    required_schema_surfaces: ["schema/zmeta-event.schema.json", "schema/zmeta-event-1.0.schema.json"]
    required_policy_surfaces: ["policy/semantics.yaml", "policy/violation-codes.yaml"]
    required_gateway_surfaces: ["gateway/src/validators.py"]
    required_conformance_fixtures: ["conformance/must-pass.jsonl", "conformance/must-fail.jsonl"]
    required_test_commands: ["python tools/validate_conformance.py --strict"]
    allowed_claimants: ["producer", "gateway", "reference_stack", "tooling"]
    current_repo_support: implemented
    references: ["spec/semantics-contract.md", "schema/zmeta-event-1.0.schema.json", "tools/validate_conformance.py"]

  - <<: *class_defaults
    class_id: ZMETA-VERSION-DISPATCH
    display_name: Exact Version Dispatch
    status: implemented
    version_scope: ["1.0", "1.1.0-experimental"]
    description: Exact zmeta_version dispatch and isolation between locked v1.0 and experimental v1.1.0 branches.
    semantic_contract_sections: ["Versioning", "Extension governance"]
    required_schema_surfaces: ["schema/zmeta-event.schema.json", "schema/zmeta-event-1.0.schema.json", "schema/zmeta-event-1.1.0.schema.json"]
    required_gateway_surfaces: ["gateway/src/validators.py"]
    required_conformance_fixtures: ["examples/zmeta-v1.1-examples.jsonl"]
    required_test_commands: ["python -m pytest -q gateway/tests/test_schema_version_discrimination.py gateway/tests/test_compat_normalizer.py gateway/tests/test_check_compat_cli.py"]
    dependencies: ["ZMETA-CORE"]
    allowed_claimants: ["gateway", "reference_stack", "tooling"]
    current_repo_support: implemented
    references: ["spec/versioning.md", "schema/README.md", "gateway/tests/test_schema_version_discrimination.py"]

  - <<: *class_defaults
    class_id: ZMETA-V1-0-SCHEMA
    display_name: ZMeta v1.0 Schema
    status: implemented
    version_scope: ["1.0"]
    description: Locked v1.0 schema vocabulary, payload constraints, and dispatcher compatibility.
    required_schema_surfaces: ["schema/zmeta-event.schema.json", "schema/zmeta-event-1.0.schema.json"]
    required_conformance_fixtures: ["conformance/must-pass.jsonl", "conformance/must-fail.jsonl", "examples/zmeta-examples-1.0.jsonl"]
    required_test_commands: ["python tools/validate_conformance.py --strict"]
    dependencies: ["ZMETA-CORE"]
    allowed_claimants: ["producer", "gateway", "reference_stack", "tooling"]
    current_repo_support: implemented
    references: ["schema/README.md", "schema/zmeta-event-1.0.schema.json"]

  - <<: *class_defaults
    class_id: ZMETA-V1-1-EXPERIMENTAL
