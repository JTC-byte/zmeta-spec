    allowed_claimants: ["gateway", "reference_stack", "tooling"]
    current_repo_support: implemented
    future_or_reserved_notes: ["Claimable only as experimental branch support, not as v1.0 or adopted vocabulary."]
    extension_registry_dependencies: ["STRUCTURED_QUALITY_BLOCK", "ERROR_ELLIPSE_M", "DATA_REF_FORMAL_BEHAVIOR", "EO_FEATURE_CONTRACT", "IR_FEATURE_CONTRACT", "ACOUSTIC_FEATURE_CONTRACT", "NETWORK_FEATURE_CONTRACT", "SENSOR_STATUS", "PLATFORM_STATUS", "RETURN_TO_BASE", "LAND", "LOITER", "SCAN_RF", "TRACK_TARGET", "CHANGE_SENSOR_MODE"]
