  - <<: *entry_defaults
    name: DIALECT_LABEL
    display_name: Dialect label for admitted events
    category: trust_integrity
    status: proposed
    semantic_definition: >-
      Future label naming the non-canonical source dialect from which a
      schema-valid event was translated before a gateway admitted it
      (contract Sections 3.4 and 4.5.1), so a consumer can tell an event
      translated from a dialect from one authored canonically. It never
      applies to schema-invalid traffic, which is not admitted as ZMeta at
      all, because policy must not make invalid semantics valid (contract
      Section 3.2).
    rationale: >-
      A gateway or consumer that admits translated dialect traffic needs to
      know which dialect an admitted event came from. The kernel already
      records it where translation happens: every shipped ingress adapter
      stamps lineage.transform as translate:<schema_id>@<adapter_version>
      (contract Section 3.4 and adapters/AUTHORING.md). The open question is
      whether that record reaches the consumer, because egress projections
      can drop lineage, as the JREAP and SAPIENT egress adapters do. Where it
      does not, an admitted translated event reads as authored canonically
      downstream, which is silent meaning laundering under contract Section
      2.6.
    ignorable_by_default: false
    risk_relevant: true
    must_preserve_when_used_for_policy: true
    profile_projection_behavior: future_branch_required
    security_privacy_notes:
      - A dialect label discloses which source format a producer speaks, which can fingerprint its equipment or software; releaseability and redaction rules apply to the label as they apply to the event it describes.
      - A label is only as trustworthy as the gateway that authored it. Until gateway identity is authenticated (KEY_IDENTITY and EVENT_SIGNATURE, both proposed), any producer can emit a label that claims an event was admitted.
    references:
      - spec/semantics-contract.md
      - spec/future-branch-roadmap.yaml
      - docs/zmeta_doctrine_review_log.md
      - adapters/AUTHORING.md
    date_added: "2026-09-28"
    review_state: draft
    notes: >-
      Not valid vocabulary under v1.0 or v1.1.0. This entry holds the concept
      name so that later promotion stays collision-safe; any system_type
      token, extension key, carrier and payload shape are decided at
      promotion, and allowed_event_types stays empty until then. Promotion
      must first weigh the carriers the contract already provides: the
      translate:<schema_id>@<adapter_version> lineage.transform that an
      adapter stamps on the event it authors (Section 3.4), which Sections 2.4
      and 4.2 forbid adding to an event a gateway only forwards; the
      external-promotion metadata and promote:<adapter>:<policy>
      lineage.transform of Section 4.5.1; adapter transform names in
      payload-scoped provenance (Section 9.2); a same-stream diagnostic keyed
      by original_event_id, such as a SCHEMA_VIOLATION warning about an
      accepted event; and, for a warn, degrade or quarantine decision, the
      compact self-label in a policy-scoped extension on the accepted event
      that Section 3.3 requires when the event may travel without its
      diagnostic, which the reference gateway uses for risk adjudication. If
      one of them carries the dialect to the consumer honestly, no new
      vocabulary is needed and this entry resolves by pointing to it. The
      risk flags are set so the label cannot be treated as ignorable and must
      be preserved whenever policy uses it, following doctrine F1-01, which
      booked the opposite flags on the reserved replay records as a promotion
      blocker; projection behavior is decided in the branch. The consumers
      known today appear to belong to one organization, and they count as
      one instance under the promotion bar (doctrine U1-02, decided
      2026-10-01).
      Neighbours: QUARANTINED_EVENT (reserved) labels a quarantined event, and
      KEY_IDENTITY and EVENT_SIGNATURE (proposed) carry producer identity and
      signing; this entry names the dialect only.

