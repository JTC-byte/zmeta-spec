registry_version: 1
generated_for_zmeta_versions:
  - "1.0"
  - "1.1.0"
authority: spec/semantics-contract.md
last_updated: "2026-07-07"
status_values:
  - reserved
  - proposed
  - experimental
  - adopted
  - deprecated
  - rejected
  - superseded
category_values:
  - observation_modality
  - observation_feature_contract
  - inference_type
  - fusion_extension
  - state_extension
  - command_task_type
  - system_status_type
  - profile_export_control
  - trust_integrity
  - coalition_release
  - ai_model_provenance
  - pnt_integrity
  - replay_test
  - adapter_vendor_namespace
  - encoding_projection
  - conformance_class
  - track_lifecycle
  - data_evidence
  - operator_display
projection_behavior_values:
  - not_applicable
  - preserve
  - preserve_or_compact
  - optional_omission
  - prohibited
  - future_branch_required

defaults:
  entry: &entry_defaults
    version_branch: null
    introduced_in: null
    owner: ZMeta Maintainers
    allowed_event_types: []
    allowed_event_subtypes: []
    payload_scope: []
    profile_scope: []
    schema_status: none
    policy_status: none
    adapter_gateway_status: none
    encoding_status: none
    conformance_status: none
    ignorable_by_default: true
    profile_projection_behavior: not_applicable
    risk_relevant: false
    must_preserve_when_used_for_policy: false
    collision_rules:
      - no_v1_0_collision
      - no_layer_collapse
      - no_core_redefinition
    security_release_notes: []
    security_privacy_notes: []
    migration_notes: []
    fixture_references: []
    references:
      - docs/s1_03_extension_registry_plan.md
    date_added: "2026-05-07"
    review_state: draft
    supersedes: []
    superseded_by: null
    notes: []

entries:
