  - <<: *entry_defaults
    name: ACOUSTIC_FEATURE_CONTRACT
    display_name: Acoustic feature contract
    category: observation_feature_contract
    status: experimental
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: >-
      v1.1.0 feature contract for acoustic observation measurements, a
      dominant frequency and a level carried as a decibel sound level
      (spl_db, reference declared by level_reference), as a calibrated
      linear pressure (pressure_pa with pressure_statistic), or both; the
      level applies over payload.t_start to t_end when present and
      otherwise at event.ts (contract section 5.6).
    rationale: Defines acoustic measured facts without creating track identity or inference labels.
    allowed_event_types: ["OBSERVATION_EVENT"]
    allowed_event_subtypes: ["ACOUSTIC"]
    payload_scope: ["payload.features"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    references: ["schema/zmeta-event-1.1.0.schema.json", "schema/README.md"]
    review_state: approved
    notes:
      - >-
        2026-09-12 (F2-08): the required level may now be carried as spl_db or
        as pressure_pa with pressure_statistic; the semantic_definition was
        widened in the same change and spl_db keeps its meaning.

  - <<: *entry_defaults
    name: ACOUSTIC_LEVEL_REFERENCE
    display_name: Acoustic level reference declaration
    category: observation_feature_contract
    status: experimental
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: >-
      v1.1.0 optional features.level_reference marker on ACOUSTIC observations
      declaring the reference of spl_db ("SPL_RE_20UPA", "SPL_RE_1UPA", "DBFS",
      or "DB_RELATIVE"); absent means the feature contract status quo, dB SPL
      re 20 uPa. Recorded tension with contract section 6.5, which requires an
      alternate unit to be converted or carried in an explicitly named
      extension field; the marker keeps the value in the canonical field with
      its reference declared beside it, the POWER_REFERENCE shape, and the
      6.5 sentence is deferred to the post-lock contract pass. On the locked
      v1.0 lane the compliant form remains an explicitly named feature.
    rationale: >-
      spl_db assumes a calibrated sound pressure against the airborne
      reference. Hydrophones state levels re 1 uPa, and an internet-relayed
      hydrophone with unpublished sensitivity and gain-adjusted compressed
      audio cannot state a sound pressure at all, only a full-scale level. A
      declaration of reference makes the uncalibrated or underwater value
      sayable without laundering it into airborne SPL, the same mechanism as
      features.power_reference on RF. It constrains the meaning, not the
      source, and it does not assume a hydrophone.
    allowed_event_types: ["OBSERVATION_EVENT"]
    allowed_event_subtypes: ["ACOUSTIC"]
    payload_scope: ["payload.features.level_reference"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    risk_relevant: true
    profile_projection_behavior: preserve
    security_privacy_notes:
      - >-
        An undeclared level reference invites comparison of incommensurable
        quantities across sensors, and a relative level read as calibrated SPL
        overstates what was measured. The declaration must survive projection
        with the value.
    fixture_references:
      - gateway/tests/test_schema_version_discrimination.py
      - gateway/tests/test_structural_guidance.py
    references:
      - schema/zmeta-event-1.1.0.schema.json
      - docs/zmeta_doctrine_review_log.md
    date_added: "2026-09-10"
    review_state: approved
    notes:
      - >-
        Created experimental by maintainer adjudication 2026-09-10 (doctrine
        cycle F2) on the A1-01 mechanism, from a live Orcasound hydrophone
        capture whose honest 1.1.0 form validated only by laundering dBFS into
        spl_db. Same mechanism as POWER_REFERENCE. Orcasound is the first
        independent evidence instance for this mechanism; the promotion
        evidence bar is NOT claimed met, and this entry enters experimental
        with that condition unmet by explicit maintainer adjudication, the
        same direct-to-experimental path and the same logged tension as
        POWER_REFERENCE. The single-concept generalization with
        POWER_REFERENCE is booked for the AAR; promotion beyond experimental
        stays gated on the evidence bar.
      - >-
        The spl_db description was corrected in the same change; the absent
        meaning is unchanged, so shipped 1.1.0 events keep their meaning.
      - >-
        2026-09-12 (F2-08): the required-list relaxation lets the marker be
        present on an event with no spl_db. That shape has no instance; it is
        recorded as live-test checklist question F2-Q1 under playbook
        discipline 10 rather than bound in the schema, and the description
        now states that the marker qualifies spl_db only and is inert without
        it.

  - <<: *entry_defaults
    name: ACOUSTIC_PRESSURE_LEVEL
    display_name: Acoustic linear pressure level
    category: observation_feature_contract
    status: experimental
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: >-
      v1.1.0 optional features.pressure_pa (calibrated acoustic pressure
      amplitude in pascals, greater than zero) with
      features.pressure_statistic ("RMS", "PEAK", or "PEAK_TO_PEAK") on
      ACOUSTIC observations, present together or not at all, as the level
      carrier for domains that publish linear pressure rather than a
      decibel. The ACOUSTIC arm requires center_freq_hz and a level in at
      least one of the two forms; spl_db remains the decibel carrier and
      the statistic never qualifies it. The level applies over
      payload.t_start to t_end when present and otherwise at event.ts
      (contract section 5.6). On the locked v1.0 lane, which has no
      ACOUSTIC feature arm, the pair validates as free-form content with
      no semantics attached.
    rationale: >-
      Atmospheric infrasound publishes calibrated pressure in pascals as RMS,
      peak and peak-to-peak with none privileged, and never a decibel level,
      so a required decibel field forced that domain to manufacture a number.
      The shape composes from existing primitives (unit in the name per
      contract section 6.5, center_freq_hz and bandwidth_hz for the band,
      payload.t_start and t_end for the window per section 5.6) and was added
      to the experimental ACOUSTIC feature contract on the 1.1.0 branch rather
      than served by a namespaced extension, so that a consumer pinned to
      1.1.0 can read the level. A governed pressure contract of its own was
      refused on the alphabet and outer-ring gates.
    allowed_event_types: ["OBSERVATION_EVENT"]
    allowed_event_subtypes: ["ACOUSTIC"]
    payload_scope: ["payload.features.pressure_pa", "payload.features.pressure_statistic"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    risk_relevant: true
    ignorable_by_default: false
    profile_projection_behavior: preserve
    security_privacy_notes:
      - >-
        A pressure amplitude with its statistic dropped in projection reads as
        an unqualified level; the pair must survive projection together.
    fixture_references:
      - gateway/tests/test_schema_version_discrimination.py
      - gateway/tests/test_structural_guidance.py
    references:
      - schema/zmeta-event-1.1.0.schema.json
      - docs/zmeta_doctrine_review_log.md
    date_added: "2026-09-12"
    review_state: approved
    notes:
      - >-
        Created experimental by maintainer adjudication 2026-09-12 (doctrine
        cycle F2, entry F2-08), from the downstream COP evidence note of 2026-09-11:
        three acoustic sources investigated (Orcasound hydrophone, MBARI MARS
        hydrophone, EarthScope infrasound), one running producer, zero
        implementations emitting a pascals value. The promotion evidence bar
        is NOT claimed met; this entry enters experimental with that condition
        unmet by explicit maintainer adjudication, the same
        direct-to-experimental path and the same logged tension as
        POWER_REFERENCE and ACOUSTIC_LEVEL_REFERENCE. A first draft registered
        this name as reserved while the same change made the fields
        schema-valid; the pre-cut verification refused that as a contradiction
        of the reserved definition, and the reserved-leak check gained an
        observation_feature_contract arm so that shape cannot recur.
      - >-
        The redistribution status of the EarthScope infrasound holdings whose
        station codes match published CTBTO array designators is unsettled per
        the downstream note; that source supports the design rationale here
        and is not relied on as a fielded implementation.
      - >-
        ignorable_by_default is false because pressure_pa can be the sole
        level carrier: a consumer that drops the pair holds an ACOUSTIC
        observation with no level, whereas level_reference qualifies spl_db
        where spl_db is present and is inert otherwise. The registry-wide
        default of true is a booked
        post-lock item (execution review 2026-09-08).

