      - schema/README.md
      - gateway/tests/test_schema_version_discrimination.py
    review_state: approved
    notes:
      - Experimental v1.1.0 only; v1.0 generic quality objects do not adopt this formal contract.

  - <<: *entry_defaults
    name: ERROR_ELLIPSE_M
    display_name: Error ellipse meters
    category: state_extension
    status: adopted
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: v1.1.0 geospatial uncertainty block under canonical geo objects using meter units and true-north orientation.
    rationale: Represents position uncertainty without changing WGS-84 latitude/longitude or HAE altitude semantics.
    allowed_event_types: ["OBSERVATION_EVENT", "FUSION_EVENT", "STATE_EVENT"]
    payload_scope: ["payload.geo.error_ellipse_m", "payload.estimated_state.geo.error_ellipse_m"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    risk_relevant: true
    profile_projection_behavior: preserve_or_compact
    security_privacy_notes:
      - Positional uncertainty drives act-on decisions. An understated ellipse invites action on a fix the source never claimed, and a precise ellipse over a sensitive site reveals collection quality. Coalition or redaction release coarsens the ellipse through governed precision policy, never by silent member removal, and display renderings never zero-fill absent members.
    fixture_references:
      - adapters/ingress/adsb/test_adsb_ingress.py
      - adapters/egress/cot/test_zmeta_to_cot.py
      - gateway/tests/test_schema_version_discrimination.py
      - conformance/profile-precision/must-pass.jsonl
      - conformance/profile-precision/must-fail.jsonl
    migration_notes:
      - The v1.0-era adapter convention semi_major_m/semi_minor_m inside free-form quality objects is retired. The ADS-B reference writer emits the formal spellings under payload.geo.error_ellipse_m with conditional zmeta_version 1.1.0 stamping as of 2026-08-03. Readers never default absent members to zero.
    references:
      - schema/zmeta-event-1.1.0.schema.json
      - schema/README.md
      - spec/semantics-contract.md
      - gateway/tests/test_schema_version_discrimination.py
    review_state: approved
    notes:
      - Adopted 2026-08-02 by maintainer adjudication (fielded LOB-fusion workflow depends on it; promotion rides the v1.1.20 release). Compact binary stays v1.0-only and refuses v1.1.0 events by the same adjudication, so no integer key exists for this block.

  - <<: *entry_defaults
    name: GEO_DIMENSIONALITY
    display_name: Declared geo dimensionality
    category: state_extension
    status: adopted
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: v1.1.0 canonical geo carries an optional dimensionality member ("2D" or "3D", absent means "3D"); "2D" declares a horizontal-only position and prohibits alt_m entirely, paired with quality.geo_status VERTICAL_UNAVAILABLE per contract sections 21.1 and 21.8.
    rationale: Sources with a real, exact horizontal fix and no geometric vertical (surface vessels, barometric-only aircraft) were refused canonical geo or forced toward fabricated altitude; a declared 2-D form is the honest complete statement of what such a source measured.
    allowed_event_types: ["OBSERVATION_EVENT", "FUSION_EVENT", "STATE_EVENT"]
    payload_scope: ["payload.geo.dimensionality", "payload.estimated_state.geo.dimensionality"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    risk_relevant: true
    profile_projection_behavior: preserve
    security_privacy_notes:
      - A consumer that reads a 2-D position as a full fix may act on a vertical that was never claimed. The declaration and the VERTICAL_UNAVAILABLE token must survive projection together; dropping either turns an honest horizontal-only fix into an apparent full fix.
    fixture_references:
      - gateway/tests/test_a1_02_dimensionality.py
      - conformance/profile-precision/must-pass.jsonl
      - conformance/profile-precision/must-fail.jsonl
    references:
      - schema/zmeta-event-1.1.0.schema.json
      - spec/semantics-contract.md
      - gateway/tests/test_a1_02_dimensionality.py
    review_state: approved
    notes:
      - Doctrine A1-02, promotion bar met by two independent implementations (ADS-B, AIS). Shape approved with rationale 2026-08-02, schema landed red-first 2026-08-03, normative text in contract section 21.8. Absent-means-3D is corpus compatibility, not a producer default.
      - The estimated_state scope is fixture-pinned for the shape rule and the AVAILABLE-lie arm (wave-2 attack pass finding); arm 1's token rule deliberately does not extend to estimated_state until a producer for that container exists, and adding one without extending it reopens this entry.

  - <<: *entry_defaults
    name: BEARING_FRAME
    display_name: Bearing reference frame marker
    category: observation_feature_contract
    status: experimental
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: v1.1.0 optional bearing.frame marker asserting the canonical true-north reference frame; TRUE_NORTH is the only valid value so mislabeled sensor-native frames fail schema validation.
    rationale: Records bearing frame provenance on the wire so array-relative or otherwise uncompensated direction-of-arrival values cannot masquerade as canonical true-north bearings.
    allowed_event_types: ["OBSERVATION_EVENT", "FUSION_EVENT"]
    payload_scope: ["payload.bearing.frame", "payload.estimated_state.bearing.frame"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    references:
      - schema/zmeta-event-1.1.0.schema.json
      - schema/README.md
      - spec/semantics-contract.md
      - gateway/tests/test_schema_version_discrimination.py
    date_added: "2026-06-11"
    review_state: approved
    notes:
      - Experimental v1.1.0 only; v1.0 bearing objects are locked and reject the frame key.
      - v1.0 producers may record frame provenance only via free-form quality.bearing_frame and quality.heading_source.

  - <<: *entry_defaults
    name: POWER_REFERENCE
    display_name: Power reference declaration
    category: observation_feature_contract
    status: experimental
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: v1.1.0 optional features.power_reference marker on RF observations declaring the reference of power_dbm ("DBM_ABSOLUTE", "DBFS", or "DB_RELATIVE"); absent means the contract section 7.4 status quo, absolute dBm from a calibrated receiver.
    rationale: power_dbm assumes a calibrated receiver, and most fielded SDRs report uncalibrated full-scale or relative power. A declaration of reference makes the uncalibrated value sayable without laundering it into absolute dBm, the same shape as bearing.frame and quality.calibration_state. It constrains the meaning, not the source, so one optional discriminator covers every SDR.
    allowed_event_types: ["OBSERVATION_EVENT"]
    payload_scope: ["payload.features.power_reference"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    risk_relevant: true
    profile_projection_behavior: preserve
    security_privacy_notes:
      - An undeclared power reference invites cross-sensor comparison of incommensurable quantities. Minus forty from a calibrated receiver and minus forty from a DoA chain's RSSI are different physical claims, and the difference appears exactly when a second sensor's power meets the first in one consumer, the interoperability case ZMeta exists for. The declaration must survive projection with the value; dropping it restores the ambiguity this marker removes.
    fixture_references:
      - adapters/ingress/adsb/test_adsb_ingress.py
      - gateway/tests/test_schema_version_discrimination.py
    references:
      - schema/zmeta-event-1.1.0.schema.json
      - spec/semantics-contract.md
      - docs/zmeta_doctrine_review_log.md
    date_added: "2026-08-09"
    review_state: approved
    notes:
      - Doctrine A1-01, experimental split directed by maintainer adjudication 2026-08-09. The in-repo instances (kraken RSSI dB, ADS-B dBFS) demonstrate the need but share one codebase, author and organization, so they do not meet the Promotion Evidence Requirements independence definition; this entry is the experiment that gathers consumer evidence, not a promotion. The ADS-B reference adapter emits the marker by flag (rf_power_reference) under conditional zmeta_version 1.1.0 stamping; the fielded kraken adapter is deliberately unchanged.

  - <<: *entry_defaults
    name: TIMING_ERROR_BASIS
    display_name: Timing error basis declaration
    category: pnt_integrity
    status: experimental
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: >-
      v1.1.0 optional timing_quality.est_error_basis member ("MEASURED",
      "DECLARED_BOUND", "CONVENTION_DEFAULT", or "UNRESOLVED") stating how
      est_error_ms was obtained; absent means the status quo, no basis stated.
    rationale: >-
      est_error_ms is a required worst-case bound, and a producer with no
      clock-discipline evidence has no defensible number; the repo's interim
      is the unknown-clock convention shared by the reference ingress adapters
      (adapters/ingress/time_utils.py, UNKNOWN, UNSYNCED, 60000 ms), which
      overstates uncertainty in the safe direction but cannot say why the
      bound is what it is. A consumer cannot tell a measured 60 s from a
      conventional 60 s. The basis lets the honest label travel with the
      value on the experimental branch while the locked v1.0 structure stays
      byte-identical.
    allowed_event_types: ["OBSERVATION_EVENT", "INFERENCE_EVENT", "FUSION_EVENT", "STATE_EVENT", "COMMAND_EVENT"]
    payload_scope: ["payload.timing_quality.est_error_basis"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    risk_relevant: true
    profile_projection_behavior: preserve
    security_privacy_notes:
      - >-
        A conventional bound presented without its basis reads as a
        measurement; the basis must survive projection with the bound.
    fixture_references:
      - gateway/tests/test_schema_version_discrimination.py
      - gateway/tests/test_structural_guidance.py
    references:
      - schema/zmeta-event-1.1.0.schema.json
      - docs/zmeta_doctrine_review_log.md
    date_added: "2026-09-10"
    review_state: approved
    notes:
      - >-
        Created experimental by maintainer adjudication 2026-09-10 (doctrine
        cycle F2) as the live instance of R1-11-04, timing_quality cannot say
        bound unresolved. An honest Form A hydrophone event failed on
        est_error_ms rather than fabricate. R1-11-04 preferred a
        gateway-attached reason code over touching the locked structure; the
        1.1.0 copy is experimental, so an optional member is the
        declaration-floor form there, and v1.0 rejects the key by its own
        closure. The policy-recognised alternate path
        payload.quality.timing_quality is not schema-governed, so the member
        is unenforced there and is not claimed in payload_scope.

  - <<: *entry_defaults
    name: DATA_REF_FORMAL_BEHAVIOR
