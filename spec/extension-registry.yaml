    rationale: Links lightweight events to retained artifacts without embedding raw data or replacing lineage.
    allowed_event_types: ["OBSERVATION_EVENT"]
    payload_scope: ["payload.data_ref", "payload.data_refs"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    references:
