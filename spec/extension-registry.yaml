      and keeps a destruction receipt needs a state the contract's Section
      9.4 list does not separate from "not retained": the raw data existed,
      was destroyed under an authorized procedure, and a receipt records
      it. Reading such a reference as not retained would hide that the data
      once existed, and reading it as unresolved would make a lawful
      destruction look like a broken producer. Destroyed-with-receipt, with
      a reference to the receipt, is recorded as a candidate ninth state.
      Whether the destroying node also emits an event for the destruction
      is open; the first deployment keeps the receipt as a record in its
      own data store and claims no event. Evidence is one organization's
      design (roadmap raw-data-absent-evidence-status); status unchanged.

