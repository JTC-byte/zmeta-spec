    name: STRUCTURED_QUALITY_BLOCK
    display_name: Structured quality block
    category: observation_feature_contract
    status: experimental
    version_branch: "1.1.0"
    introduced_in: "1.1.0"
    semantic_definition: v1.1.0 structured payload quality metadata including measurement error, calibration state, geo status, and signal quality fields.
    rationale: Formalizes quality metadata without replacing top-level confidence.
    allowed_event_types: ["OBSERVATION_EVENT"]
    payload_scope: ["payload.quality"]
    schema_status: implemented
    policy_status: not_applicable
    conformance_status: implemented
    references:
