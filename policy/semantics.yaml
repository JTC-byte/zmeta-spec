semantics:
  observation_event:
    rf_window_midpoint_tolerance_ms: 1
    payload_must_not_contain:
      - track_id
      - entity_class
      - classification
      - label
      - class_name
      - confidence
  inference_event:
    # Full contract 7.5 fused-state denylist. An INFERENCE claim is a narrow
    # analytic assertion, not a fused track: payload and payload.claim MUST NOT
    # contain track_id, members, or estimated_state. Enforced recursively, so
    # nesting inside claim sub-objects or free-form payload objects cannot
    # launder fused identity or fused state into an inference.
    payload_must_not_contain:
      - track_id
      - members
      - estimated_state
  state_event:
    # Full contract 7.7 raw-artifact denylist. A STATE projection is a fused
    # summary and MUST NOT re-carry raw observation features, measurements,
    # observation modality, observation timestamps, or raw artifact references.
    # Enforced recursively, so nesting inside extensions/objects cannot launder
    # a raw field into an operator-facing state event.
    payload_must_not_contain:
      - features
      - raw_features
      - modality
      - measurement
      - measurements
      - t_start
      - t_end
      - data_ref
      - data_refs
  command_event:
    requires_deconfliction: true
    # Full contract 7.8 altitude denylist. COMMAND_EVENT SHALL NOT specify
    # altitude; the receiving autonomy/drone deconflicts vertical internally, so
    # a command must never carry it (in payload, target_geo, geometry, or
    # extensions - the recursive check covers all nesting). Bare `alt` is kept
    # as a defensive superset of the eight names the contract enumerates.
    # Residual: altitude re-keyed under an arbitrary non-reserved name (e.g.
    # `z_m`) still passes this name denylist - documented accepted limitation
    # (release/RELEASE_NOTES_v1.1.10.md "Known Enforcement Limitation").
    payload_must_not_contain:
      - alt
      - alt_m
      - altitude
      - altitude_m
      - alt_hae_m
      - alt_msl_m
      - agl_m
      - target_alt_m
      - target_altitude
    dedupe_key: task_id
  timing_quality:
    required: true
    required_event_types:
      - OBSERVATION_EVENT
      - INFERENCE_EVENT
      - FUSION_EVENT
      - STATE_EVENT
      - COMMAND_EVENT
    per_event_paths:
      - payload.timing_quality
      - payload.quality.timing_quality
      - payload.quality
    required_fields:
      - time_source
      - sync_state
      - est_error_ms
      - last_sync_ts
  system_event:
    schema_violation_required_metrics_fields:
      - reason_code
      - original_event_id
    schema_violation_allowed_reason_codes:
      - SCHEMA_INVALID
      - VERSION_SEMANTICS_MISMATCH
      - EVENT_SUBTYPE_MISMATCH
      - EVENT_TYPE_NOT_ALLOWED_FOR_ROLE
      - EVENT_TYPE_NOT_ALLOWED_FOR_PROFILE
      - COMMAND_NOT_DECONFLICTED
      - COMMAND_HAS_ALTITUDE
      - INVALID_COMMAND_GEOMETRY
      - COMMAND_TASK_TYPE_INVALID
      - OBSERVATION_HAS_IDENTITY
      - OBSERVATION_HAS_CLASSIFICATION
      - INFERENCE_HAS_TRACK_ID
      - INFERENCE_HAS_FUSION_STATE
      - STATE_HAS_RAW_FEATURES
      - INVALID_QUALITY_UNITS
      - INVALID_QUALITY_BEARING_FRAME
      - INVALID_QUALITY_HEADING_SOURCE
      - INVALID_MODALITY_FEATURES
      - INVALID_GEO_FIELD
      - INVALID_TIME_FORMAT
      - RF_WINDOW_PAIRING_INVALID
      - RF_WINDOW_MIDPOINT_INVALID
      - LINEAGE_MISMATCH
      - LINEAGE_PAYLOAD_BASED_ON_NOT_SUBSET
      - LINEAGE_FUSION_MEMBERS_NOT_IN_BASED_ON
      - LINEAGE_PARENT_UNRESOLVED
      - LINEAGE_PARENT_TYPE_INVALID
      - SCHEMA_VIOLATION_MISSING_REASON_CODE
      - SCHEMA_VIOLATION_MISSING_ORIGINAL_EVENT_ID
      - SCHEMA_VIOLATION_INVALID_REASON_CODE
      - TASK_ACK_MISSING_TASK_ID
      - TASK_ACK_MISSING_REQUIRED_FIELD
      - TASK_ACK_MISSING_ORIGINAL_EVENT_ID
      - TASK_ACK_MISSING_REASON_CODE
      - TASK_ACK_INVALID_STATE
      - TASK_ACK_INVALID_REASON_CODE
      - LINK_STATUS_MISSING_REQUIRED_FIELD
      - LINK_STATUS_INVALID_STATE
      - LINK_STATUS_MISSING_REASON_CODE
      - LINK_STATUS_INVALID_REASON_CODE
      - SENSOR_STATUS_STATE_MISMATCH
      - PLATFORM_STATUS_POWER_MISSING
      - PRODUCER_NOT_ALLOWED
      - PROFILE_MISMATCH
      - TIMING_STATUS_MISSING
      - TIMING_STATUS_STALE
      - TIMING_STATUS_AGE_NEGATIVE
      - TIMING_STATUS_UNSYNCED
      - TIMING_STATUS_HOLDOVER_NON_MONOTONIC
      - RF_WINDOW_MIDPOINT_MISMATCH
      - EVENT_DUPLICATE
      - TASK_DUPLICATE
      - TASK_ACK_DUPLICATE
    task_ack_required_metrics_fields:
      - task_id
      - original_event_id
    task_ack_allowed_states:
      - RECEIVED
      - ACCEPTED
      - REJECTED
      - EXECUTING
      - COMPLETED
      - FAILED
      - CANCELLED
      - EXPIRED
      - DUPLICATE_IGNORED
    task_ack_reason_code_required_states:
      - REJECTED
      - FAILED
      - CANCELLED
      - EXPIRED
      - DUPLICATE_IGNORED
    task_ack_allowed_reason_codes:
      - SCHEMA_INVALID
      - EVENT_TYPE_NOT_ALLOWED_FOR_ROLE
      - EVENT_TYPE_NOT_ALLOWED_FOR_PROFILE
      - PRODUCER_NOT_ALLOWED
      - COMMAND_NOT_DECONFLICTED
      - COMMAND_HAS_ALTITUDE
      - TASK_DUPLICATE
      - TASK_EXPIRED
      - TASK_CANCELLED
      - TASK_FAILED
      - TASK_ABORTED
      - TASK_REJECTED
    link_status_required_metrics_fields:
      - link_id
      - latency_ms
      - packet_loss_pct
      - throughput_bps
    link_status_allowed_states:
      - UP
      - DEGRADED
      - DOWN
      - UNKNOWN
    link_status_reason_code_required_states:
      - DEGRADED
      - DOWN
    link_status_allowed_reason_codes:
      - LINK_LOSS
      - LOW_RSSI
      - HIGH_LATENCY
      - HIGH_PACKET_LOSS
      - LOW_THROUGHPUT
      - INTERFERENCE
      - JAMMED
      - BACKHAUL_DOWN
      - NO_ROUTE
      - CONFIG_ERROR
      - POWER_SAVE
      - UNKNOWN_CAUSE
