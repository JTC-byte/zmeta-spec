        - SYSTEM_EVENT
    autonomy:
      allowed_event_types:
        - SYSTEM_EVENT

    # Legacy/reference multi-role producers retained for current examples.
    torch:
      allowed_event_types:
        - INFERENCE_EVENT
        - FUSION_EVENT
        - STATE_EVENT
      forbidden_event_types:
        - COMMAND_EVENT
    sensorops:
