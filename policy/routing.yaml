routing:
  producer_enforcement:
    require_allowlist_for_event_types:
      - INFERENCE_EVENT
      - FUSION_EVENT
      - STATE_EVENT
      - COMMAND_EVENT
  command_event:
    required_origin: sensorops
    must_pass_through: sensorops
  producers:
    torch:
      allowed_event_types:
        - INFERENCE_EVENT
        - FUSION_EVENT
        - STATE_EVENT
      forbidden_event_types:
        - COMMAND_EVENT
    sensorops:
      allowed_event_types:
        - OBSERVATION_EVENT
        - INFERENCE_EVENT
        - FUSION_EVENT
        - STATE_EVENT
        - COMMAND_EVENT
        - SYSTEM_EVENT
