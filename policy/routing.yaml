routing:
  producer_enforcement:
    require_allowlist_for_event_types:
      - COMMAND_EVENT
  command_event:
    # Enforcement note (v1.0): required_origin, must_pass_through, and
    # allowed_producers are all flattened by the reference validator
    # (gateway/src/validators.py::_is_comms_producer) into a single
    # origin-name allowlist checked against the event's producer. Per-event
    # transit-path verification is not possible in v1.0 — events carry no
    # route metadata — so these keys express the intended command topology
    # while the machine check is origin gating only.
    required_origin: sensorops
    must_pass_through: sensorops
    allowed_producers:
      - sensorops
      - retasking-engine
      - comms-deconfliction-*
  producers:
    torch:
      allowed_event_types:
        - INFERENCE_EVENT
        - FUSION_EVENT
        - STATE_EVENT
      forbidden_event_types:
        - COMMAND_EVENT
    sensorops:
      allowed_event_types:
        - OBSERVATION_EVENT
        - INFERENCE_EVENT
        - FUSION_EVENT
        - STATE_EVENT
        - COMMAND_EVENT
        - SYSTEM_EVENT
    cot-ingress:
      allowed_event_types:
        - STATE_EVENT
        - SYSTEM_EVENT
    jreap-ingress:
      allowed_event_types:
        - STATE_EVENT
        - SYSTEM_EVENT
    klv-ingress:
      allowed_event_types:
        - OBSERVATION_EVENT
        - SYSTEM_EVENT
    eo-cv-adapter:
      allowed_event_types:
        - INFERENCE_EVENT
        - SYSTEM_EVENT
    mavlink-adapter:
      allowed_event_types:
        - STATE_EVENT
        - SYSTEM_EVENT
    fusion-engine:
      allowed_event_types:
        - INFERENCE_EVENT
        - FUSION_EVENT
        - STATE_EVENT
        - SYSTEM_EVENT
    zmeta-gateway:
      allowed_event_types:
        - SYSTEM_EVENT
    retasking-engine:
      allowed_event_types:
        - COMMAND_EVENT
        - SYSTEM_EVENT
    comms-deconfliction-*:
      allowed_event_types:
        - COMMAND_EVENT
        - SYSTEM_EVENT
