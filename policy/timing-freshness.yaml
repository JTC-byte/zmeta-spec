timing_freshness:
  enabled: true
  mode: reject
  max_timing_status_age_ms:
    L: 60000
    M: 30000
    H: 10000

  # Source identity uses source.platform_id + source.producer, with
  # source.sensor_id included when present and fallback to node-level status.
  source_identity:
    required_fields:
      - source.platform_id
      - source.producer
    optional_fields:
      - source.sensor_id

  degrade:
    confidence_reduction_factor: 2.0

  use_limits:
    warn:
      allowed_uses:
        - DISPLAY
        - LOCAL_AWARENESS
        - ALERTING
        - FUSION_INPUT
        - STATE_UPDATE
      prohibited_uses:
        - COMMAND_BASIS
        - AUTONOMY_TASKING
    degrade:
      allowed_uses:
        - DISPLAY
        - LOCAL_AWARENESS
        - ALERTING
      prohibited_uses:
        - FUSION_INPUT
        - STATE_UPDATE
        - COMMAND_BASIS
        - AUTONOMY_TASKING

  holdover_est_error_monotonic:
    enabled: true
    mode: warn
