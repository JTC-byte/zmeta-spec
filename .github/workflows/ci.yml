name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        id: setup_py
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        continue-on-error: true

      - name: Setup Python 3.11
        if: steps.setup_py.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gateway/requirements.txt -r requirements-dev.txt

      - name: Lint schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open("schema/zmeta-event-1.0.schema.json", "r", encoding="utf-8") as handle:
              schema = json.load(handle)
          Draft202012Validator.check_schema(schema)
          print("schema ok")
          PY

      - name: Validate examples
        run: |
          python tools/validate_examples.py --require-all

      - name: Conformance pack
        run: |
          python tools/validate_conformance.py --strict

      - name: Packet size summary
        run: |
          python tools/measure_packet_size.py --file examples/zmeta-profile-L-examples.jsonl --encodings compact --max-bytes 240 --summary-only

      - name: Run tests
        run: python -m pytest -q gateway/tests adapters
