  - code: GEO_ZERO_FILL_SUSPECTED
    remediation: >-
      This warn-only heuristic fires when a canonical geo block carries lat
      and lon both exactly 0.0, checked at payload.geo, payload.claim.geo, and
      payload.estimated_state.geo, because contract 6.8 forbids zero-filled
      position while (0,0) cannot be distinguished from the legitimate
      null-island coordinate, so the check warns rather than rejects. If the
      position is genuinely unknown, do not fill lat/lon with 0.0: omit geo
      entirely, and on an observation payload record the absence with
      quality.geo_status set to UNAVAILABLE, the token the schema defines as
      meaning no canonical geo is present and refuses to accept beside a
      present geo block. Both shipped schemas require payload.geo on
      TRACK_STATE, so a track state with no complete usable position must not
      be emitted at all rather than zero-filled.
