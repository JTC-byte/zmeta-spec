  - code: COMMAND_NOT_DECONFLICTED
    remediation: >-
      This fires on a COMMAND_EVENT in either of two cases:
      `payload.requires_deconfliction` is not exactly `true` (the gateway
      checks this independently of the schema, which both requires the field
      and pins it to `const: true`), or the event's `source.producer` does not
      match the routing policy's command allowlist. Set
      `payload.requires_deconfliction` to `true` on every COMMAND_EVENT, and
      emit COMMAND_EVENTs only from a producer identity matching
      `policy/routing.yaml#routing.command_event`, where the validator pools
      `allowed_producers`, `required_origin`, and `must_pass_through` into one
      origin-name allowlist (default topology: `sensorops`,
      `retasking-engine`, `comms-deconfliction-*`), which means routing the
      command through a Comms/Deconfliction Node or command-authorized
      producer rather than issuing it directly from the tasking source.
    citations:
