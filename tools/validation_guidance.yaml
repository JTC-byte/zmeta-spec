  - code: INVALID_QUALITY_UNITS
    remediation: >-
      INVALID_QUALITY_UNITS marks a unit label under payload.quality that is
      not a canonical ZMeta unit; the v1.1.0 schema pins the one unit-bearing
      quality field, payload.quality.measurement_error.unit, to m, deg, hz,
      db, dbm, ms, or px, while the locked v1.0 schema leaves payload.quality
      free-form. Report measurement error as an object with explicit value,
      unit, and metric, converting sensor-native or vendor-specific units into
      the contract's canonical convention (meters for distance and range,
      degrees true north for bearing, Hertz for frequency and bandwidth, dBm
      for power unless a field name states another unit, milliseconds for
      durations and time deltas) rather than relying on unit inference, which
      the contract forbids. The reference gateway emits no check for this
      code, and a v1.1.0 event carrying an out-of-enum unit is rejected as
      SCHEMA_INVALID instead, so treat this entry as the contract's
      canonical-unit rule rather than an active runtime test.
