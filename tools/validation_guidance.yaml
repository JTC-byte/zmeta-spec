    remediation: >-
      PROFILE_MISMATCH fires when the event's top-level `profile` field
      (L/M/H) is present and does not equal the profile the validator is
      checking against, which at the gateway is its own configured export
      profile passed in as `settings["profile"]`
      (gateway/src/validators.py:3022-3033, called from
      gateway/src/gateway.py:1696 and gateway/src/gateway.py:2446). The
      sanctioned fix is to not carry a stale or mismatched `profile` value
      forward: either omit `profile`, since the check fires only when the
      field is present and an omitted `profile` leaves the runtime
      gateway/policy profile governing export behavior
      (spec/semantics-contract.md:1576-1578), or set it to the export profile
      actually applied at that hop, since `profile` is optional and reflects
      the export profile applied at emission time
      (spec/semantics-contract.md:963, spec/semantics-contract.md:980-981).
      The gateway stamps `profile` from its own configured export profile
      before its egress check by default, but that stamping is configurable
      and does not apply to the inbound check, so an upstream event carrying
      the wrong `profile` still fails (gateway/src/gateway.py:2964-2968,
      gateway/src/gateway.py:1883-1884).
