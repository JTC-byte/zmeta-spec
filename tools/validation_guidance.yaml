      - "schema/zmeta-event-1.1.0.schema.json:1865"
      - "gateway/tests/test_reason_codes.py:189-201"
  - code: EVENT_SUBTYPE_MISMATCH
    remediation: >-
      EVENT_SUBTYPE_MISMATCH means `event.event_subtype` is outside the
      namespace the locked contract assigns to `event.event_type`, or it
      disagrees with the payload discriminator for that type:
      `payload.modality` for OBSERVATION_EVENT, `payload.inference_type` for
      INFERENCE_EVENT, `payload.task_type` for COMMAND_EVENT,
      `payload.system_type` for SYSTEM_EVENT, and the fixed TRACK_FUSION /
      TRACK_STATE for FUSION_EVENT / STATE_EVENT
      (spec/semantics-contract.md:995-1008). Set `event_subtype` to a value
      that namespace allows and make it exactly equal to the payload
      discriminator, noting the allowed set is version-gated: `zmeta_version:
      "1.0"` permits only the Section 7.3 table, while `"1.1.0"` adds
      RETURN_TO_BASE, LAND, LOITER, SCAN_RF, TRACK_TARGET and
      CHANGE_SENSOR_MODE on COMMAND_EVENT and SENSOR_STATUS and
      PLATFORM_STATUS on SYSTEM_EVENT (spec/semantics-contract.md:2173-2201,
      schema/zmeta-event-1.1.0.schema.json:350-509). Free-form and
      vendor-specific subtypes are never permitted, so re-spell it with the
      locked alphabet and carry the adapter label in payload-scoped provenance
      or an ignorable extension (spec/semantics-contract.md:1010-1014,
      docs/zmeta_vocabulary_crosswalk.md:42-54).
    citations:
