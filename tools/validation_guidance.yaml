  - code: RF_ZERO_FILL_SUSPECTED
    remediation: >-
      Both bandwidth_hz and power_dbm are exactly 0.0 in the same features
      block, which is the signature of a source record that never carried an
      RF measurement being zero-filled to satisfy the schema's required RF
      feature set (center_freq_hz, bandwidth_hz, power_dbm) rather than a
      measured reading. If the sensor is receiver-class and genuinely cannot
      measure emitter bandwidth, keep bandwidth_hz at the documented 0.0
      sentinel and report the actual measured power_dbm value, because the
      pair only warns when both are 0.0 together and power_dbm 0.0 beside a
      real bandwidth is a legitimate one-milliwatt reading; document that
      sentinel convention in the adapter's own README, as
      adapters/AUTHORING.md directs for declared sentinels. If the source
      carries no RF measurement at all, do not substitute a number, because a
      reading missing a schema-required field is refused rather than
      zero-filled.
