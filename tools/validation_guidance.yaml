  - code: LINEAGE_PARENT_TYPE_INVALID
    remediation: >-
      This fires when a lineage.based_on parent resolves in the local event
      store to an event_type outside the allowed chain for the citing event's
      type: an INFERENCE_EVENT's parents must be OBSERVATION_EVENT, a
      FUSION_EVENT's parents must be OBSERVATION_EVENT, INFERENCE_EVENT, or
      FUSION_EVENT, and a STATE_EVENT's parents must be FUSION_EVENT or
      STATE_EVENT (policy/lineage.yaml:33-42), and the same code also fires
      when a COMMAND_EVENT cites a parent outside INFERENCE_EVENT,
      FUSION_EVENT, or STATE_EVENT (policy/command-evidence.yaml:69-72). The
      fix is to emit the missing intermediate event and cite that, rather than
      skipping a link in the chain: a STATE_EVENT cites the FUSION_EVENT that
      associated the observation instead of citing the OBSERVATION_EVENT
      directly, and a single-member FusionPayload.members is schema-legal, so
      no lineage has to be invented
      (adapters/projector/track/README.md:54-59). Do not widen
      allowed_parent_event_types or motivating_parent_event_types, and do not
      relabel the citing event to a type the map does not constrain.
