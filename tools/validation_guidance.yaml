  - code: OBSERVATION_HAS_IDENTITY
    remediation: >-
      OBSERVATION_EVENT payload is walked at every nesting depth, extension
      and vendor blocks included, for track_id, entity_class, classification,
      label, class_name, or confidence, because an observation is a raw sensor
      fact and carries no identity, class, or confidence judgment. A genuine
      classifier or model claim belongs on an INFERENCE_EVENT instead: put the
      class or label value in payload.claim, put the score in the top-level
      confidence field that sits beside the event block rather than inside it,
      and supply the required payload.model.name/version plus based_on lineage
      back to the observation; track_id may only be created by a fusion node
      and lives on FUSION_EVENT or STATE_EVENT. If the colliding field is only
      a vendor-native id or score with no ZMeta semantic weight, rename it to
      a native_-prefixed key inside the namespaced payload.extensions vendor
      block, as the SAPIENT ingress adapter does after this code fired on a
      per-entry vendor confidence copy.
    citations:
