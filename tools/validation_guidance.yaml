# ZMeta validation guidance: advisory remediation text and structural rules.
#
# ADVISORY, NON-NORMATIVE. Compliance is defined solely by the semantics
# contract, the schemas, and the policy surfaces; nothing in this file is a
# compliance surface, and a wrong or unclear hint here is a documentation
# bug, never a conformance defect. Tooling that reads this file must never
# let its content change a validation verdict or an exit code
# (tools/validate.py prints `guidance` entries under violations;
# tools/explain.py applies `structural_rules` to the event shape).
#
# Provenance: each `guidance` entry was drafted against the primary sources
# cited on it, adversarially refuted by an independent verifier, and then
# re-verified in a second independent pass before graduation (2026-08-26/27,
# doctrine log F1-04; maintainer-ruled coverage of all 61 codes). The
# `structural_rules` section is the field-proven prototype layer: rules
# detect the STRUCTURE of the event, not substrings of schema error text,
# so they still work on dialect input. Citations are file:line at the time
# of writing and may drift; the cited artifact, not this file, is
# authoritative.

guidance:
  - code: SCHEMA_INVALID
    remediation: >-
      This code is a catch-all for any JSON Schema failure of a decoded event
      against the schema the validator was configured with, and for a wire
      datagram that fails to decode at all, so read the accompanying message
      and details.path (on the gateway wire, payload.metrics.error and
      payload.metrics.path) to locate the failing field instead of treating
      the code as the diagnosis. The reference gateway validates every event
      against one configured schema that defaults to the locked v1.0 lane, so
      an event declaring any other zmeta_version, including an invented one
      such as "1.2.0", can never validate, but the gateway forwards only the
      first violation after sorting by instance path, so the message you see
      is often another field rather than the zmeta_version const.
      tools/validate.py instead selects the lane schema matching the declared
      version, prints every violation, and falls back to the
      version-discriminated union only when the declared version is neither
      "1.0" nor "1.1.0".
    citations:
      - "gateway/src/validators.py:2957-2969"
      - "gateway/src/gateway.py:2363-2384"
      - "gateway/src/gateway.py:2398-2421"
      - "gateway/src/gateway.py:1727"
      - "gateway/src/gateway.py:2795"
      - "gateway/src/gateway.py:2220-2237"
      - "schema/zmeta-event.schema.json:5-17"
      - "schema/zmeta-event-1.0.schema.json:13-16"
      - "schema/zmeta-event-1.1.0.schema.json:14-17"
      - "tools/validate.py:37-47,131-148"
      - "policy/violation-codes.yaml:4-5"
  - code: VERSION_SEMANTICS_MISMATCH
    remediation: >-
      VERSION_SEMANTICS_MISMATCH means the declared `zmeta_version` does not
      match the semantic vocabulary the event actually carries, for example
      v1.1.0-only content such as structured quality, error ellipse, or
      SENSOR_STATUS/PLATFORM_STATUS under `zmeta_version: "1.0"`, or a
      non-exact string such as "1.1". Producers must emit an exact version
      (spec/semantics-contract.md:169-170) equal to one of the two branch
      consts, "1.0" (schema/zmeta-event-1.0.schema.json:14-16) or "1.1.0"
      (schema/zmeta-event-1.1.0.schema.json:15-17), which is how the canonical
      schema selects a branch (schema/zmeta-event.schema.json:5-17). Fix it by
      declaring "1.1.0" when the event uses v1.1.0-only vocabulary, or by
      removing that vocabulary to stay on "1.0"
      (spec/semantics-contract.md:139-141); canonical schemas require exact
      strings, so "1.1" is never a substitute for "1.1.0", though a
      compatibility adapter may normalize that alias before schema validation
      (spec/semantics-contract.md:148-150).
    citations:
      - "policy/violation-codes.yaml:6-7"
      - "policy/semantics.yaml:79-81"
      - "schema/zmeta-event.schema.json:5-17"
      - "schema/zmeta-event-1.0.schema.json:14-16"
      - "schema/zmeta-event-1.1.0.schema.json:15-17"
