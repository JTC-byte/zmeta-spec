    remediation: >-
      NON_FINITE_CONFIDENCE fires when the event's top-level `confidence` or
      `payload.claim.confidence` holds a float NaN or +/-Infinity, the only
      two fields this code inspects (gateway/src/validators.py:649-656),
      because JSON Schema's minimum/maximum bounds compare vacuously against
      NaN and cannot catch it (gateway/src/validators.py:3296-3298) while
      contract 8.1 requires top-level confidence to be in [0.0, 1.0]
      (spec/semantics-contract.md:1355-1356). Replace the non-finite result
      with a genuine computed value in that range: contract 8.1 directs that
      confidence be reduced or capped when timing, lineage, input quality,
      stale data, degraded compute, profile thinning, or raw-data absence
      materially reduces use safety (spec/semantics-contract.md:1360-1362),
      and contract 8.3 lists the inputs fusion and state confidence must
      account for (spec/semantics-contract.md:1377-1386). The contract defines
      no sentinel or unknown confidence value and the field is mandatory for
      INFERENCE_EVENT, FUSION_EVENT, and STATE_EVENT
