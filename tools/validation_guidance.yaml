  - code: EVENT_TYPE_NOT_ALLOWED_FOR_PROFILE
    remediation: >-
      This event's event_type is not in the target export profile's
      allowed_event_types list in policy/profiles.yaml, which permits
      STATE_EVENT, SYSTEM_EVENT, and COMMAND_EVENT under Profile L, adds
      FUSION_EVENT and OBSERVATION_EVENT under Profile M, and adds
      INFERENCE_EVENT only under Profile H. Export the event under a profile
      whose allowed_event_types includes this event_type, or, when the
      deployment is pinned to Profile L, locally derive and export an honest
      STATE_EVENT instead of the raw event, keeping lineage to the
      non-exported parents and letting confidence, timing quality, and TTL
      reflect the degraded conditions (policy/profiles.yaml:1-21;
      spec/semantics-contract.md:1522-1543). The same code also fires when the
      target profile string has no entry in policy/profiles.yaml at all, which
      the violation details show as a profile with no event_type, and that is
      a policy or configuration defect rather than a producer error.
    citations:
