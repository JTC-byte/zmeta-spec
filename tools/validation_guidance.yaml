    remediation: >-
      This fires when the event carried no complete timing quality object and
      no earlier SYSTEM_EVENT / TIME_STATUS from the same source was on
      record: the gateway resolves `payload.timing_quality`,
      `payload.quality.timing_quality`, and `payload.quality`, and accepts a
      path only when `time_source`, `sync_state`, `est_error_ms`, and
      `last_sync_ts` are all present in it. Put all four fields at
      `payload.timing_quality`, the only location the schema defines them for
      observation, inference, fusion, state, and command payloads, or emit a
      periodic SYSTEM_EVENT whose `event_subtype` and `payload.system_type`
      are both `TIME_STATUS` and whose required `state` and `payload.metrics`
      carry the timing status, which the contract accepts as the per-node
      alternative. The same four fields nested under `payload.quality` satisfy
      the gateway path list but are not schema-defined there, so their values
      are never checked against the enums and bounds and a COMMAND_EVENT
      payload rejects the key outright; `est_error_ms` must not be omitted for
      RF and time-correlated fusion, and for a clock that was never
      synchronized the reference convention fills `last_sync_ts` with the
      event timestamp.
