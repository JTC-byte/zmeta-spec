      - "spec/semantics-contract.md:1522-1543 (Profile L transmits STATE_EVENT/SYSTEM_EVENT/COMMAND_EVENT; prohibits raw observation and INFERENCE_EVENT export)"
      - "spec/semantics-contract.md:1531-1536 (nodes SHALL perform local processing to emit honest, time-bounded STATE_EVENTs; lineage MUST still be included even when parents were not exported; confidence, timing quality, and short TTL MUST reflect degraded conditions)"
