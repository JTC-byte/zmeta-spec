    remediation: >-
      An OBSERVATION_EVENT whose payload.modality is "RF" and that carries
      both payload.t_start and payload.t_end must set event.ts to the midpoint
      of that window, within a 1 ms tolerance by default
      (policy/semantics.yaml:
      semantics.observation_event.rf_window_midpoint_tolerance_ms). Set
      event.ts to t_start + (t_end - t_start)/2, or correct t_start and t_end
      so the midpoint is the true capture time, rather than reporting window
      start, window end, or an unrelated capture timestamp. The same code also
      fires when t_end precedes t_start, so verify the window ordering before
      recomputing ts.
