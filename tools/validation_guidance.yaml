      A canonical bearing with az_deg present and no frame provenance in
      either bearing.frame or payload.quality.bearing_frame is
      indistinguishable from an uncompensated one, so a magnetic or
      array-relative bearing can be silently consumed as true north
      (gateway/src/validators.py:3462-3475,
