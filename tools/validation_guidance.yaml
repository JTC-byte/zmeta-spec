  - code: COMMAND_HAS_ALTITUDE
    remediation: >-
      A COMMAND_EVENT payload must not carry altitude at any nesting depth;
      ZMeta commands express no vertical intent, and the deconfliction node or
      receiving autonomy handles vertical out of band when it converts the
      task into a native command channel (spec/semantics-contract.md:1206-1209
      for the rule, 1197-1198 and 1858-1875 for the reason). Delete the
      altitude key rather than relocating it, and do not add `target_geo` in
      its place: `target_geo` is `{lat, lon}` only, and several task types
      forbid `target_geo` outright, `SEARCH_BOX` in every version plus
      `SCAN_RF`, `TRACK_TARGET` and `CHANGE_SENSOR_MODE` in 1.1.0
      (spec/semantics-contract.md:1181,
      schema/zmeta-event-1.1.0.schema.json:1640,1698,1714,1729). The
      denylisted names are `alt`, `alt_m`, `altitude`, `altitude_m`,
      `alt_hae_m`, `alt_msl_m`, `agl_m`, `target_alt_m` and `target_altitude`
      (policy/semantics.yaml:47-56), compared case-insensitively across the
      whole payload, so this code most often fires on an altitude key nested
      inside `payload.extensions`, where the schema's own pins do not reach
      (gateway/src/validators.py:3581-3595).
    citations:
