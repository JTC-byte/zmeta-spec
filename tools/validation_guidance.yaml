  - code: ENCODING_UNSUPPORTED
    remediation: >-
      The gateway refused to encode an outgoing event on the `compact` wire:
      compact fails closed and carries only `zmeta_version` "1.0" events that
      decode back to a value-identical canonical envelope, so it substitutes
      this diagnostic rather than reducing the event
      (spec/compact-binary-mapping.md:11-20). The refusal string in the
      diagnostic's `payload.metrics.error` names which cause fired, and the
      remediation differs by cause. A non-1.0 `zmeta_version`, an integer
      outside the CBOR 64-bit range, or a timestamp with sub-millisecond
      precision is a limit of compact alone, so set the gateway's
      `output_encoding` to `json`, `cbor`, or `proto` for that path; a
      non-finite float, a non-string object key, a reference cycle, or a value
      outside the JSON model has no canonical envelope in any encoding, so the
      producer must emit a conforming event instead
      (zmeta_compact.py:594-671).
