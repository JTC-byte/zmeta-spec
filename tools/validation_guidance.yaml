  - code: INVALID_GEO_FIELD
    remediation: >-
      INVALID_GEO_FIELD is reserved diagnostic vocabulary for a bad canonical
      `geo` field, but no path in the reference gateway raises it: a partial
      geo is refused as SCHEMA_INVALID by the schema, and a (0, 0) position
      warns as GEO_ZERO_FILL_SUSPECTED. The rule behind the code is contract
      6.8, so make canonical `geo` all-or-nothing: carry `lat`, `lon`, and
