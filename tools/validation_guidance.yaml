  - code: INVALID_COMMAND_GEOMETRY
    remediation: >-
      INVALID_COMMAND_GEOMETRY names a COMMAND_EVENT whose payload.target_geo
      and payload.geometry do not match the shape its declared
      payload.task_type allows. Supply exactly the fields that task_type
      permits under the per-task_type allOf at
      schema/zmeta-event-1.1.0.schema.json:1588-1735: GOTO requires target_geo
      and forbids geometry; ORBIT requires both, with geometry carrying at
      least pattern and radius_m; SEARCH_BOX requires a 2D bbox or polygon
      geometry and forbids target_geo; HOLD, RETURN_TO_BASE and LAND forbid
      geometry; LOITER requires target_geo or geometry; SCAN_RF, TRACK_TARGET
      and CHANGE_SENSOR_MODE forbid both. No validator path emits this code
      today, so the mismatch reaches a producer as SCHEMA_INVALID from schema
      validation.
