  - code: COMMAND_TASK_TYPE_INVALID
    remediation: >-
      COMMAND_TASK_TYPE_INVALID marks a COMMAND_EVENT whose payload.task_type
      is outside the enum for the zmeta_version branch in effect: v1.0 allows
      GOTO, ORBIT, HOLD, SEARCH_BOX
      (schema/zmeta-event-1.0.schema.json:1197-1204), and v1.1.0 adds
      RETURN_TO_BASE, LAND, LOITER, SCAN_RF, TRACK_TARGET, and
      CHANGE_SENSOR_MODE (schema/zmeta-event-1.1.0.schema.json:1513-1526),
      which spec/field-dictionary.md:141 and spec/extension-registry.yaml
      still mark experimental and which carry task-specific required payload
      fields (schema/zmeta-event-1.1.0.schema.json:1588-1735). Set
      payload.task_type to a value from that branch's list and set
      event.event_subtype to the same value, since the envelope subtype must
      equal the payload discriminator (spec/semantics-contract.md:1007); a
      subtype that disagrees with an otherwise valid task_type is the separate
      EVENT_SUBTYPE_MISMATCH code, not this one. A task the enum cannot
      express is a kernel vocabulary gap, and spec/semantics-contract.md:2203
      requires semantic definition plus a validation contract before a new
      task type exists, so escalate it instead of emitting a local value.
    citations:
