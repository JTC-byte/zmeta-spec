  - code: LINEAGE_PARENT_UNRESOLVED
    remediation: >-
      This warning means the event's envelope `lineage.based_on` cites a
      parent `event_id` that this gateway instance has no record of in its
      local event store, because the parent was never delivered to it, arrived
      after the child, or was not exported over the link. It is not
      automatically a producer defect: the contract allows unresolved lineage
      as a profile or deployment policy decision that should affect trust or
      confidence when material, and permits Profile L to export STATE_EVENT
      with lineage pointing at parents that were not exported over a
      constrained link, which is why `policy/lineage.yaml` sets
      `unresolved_parent_mode` to `ignore` for Profile L and `warn` for M and
      H. If the parent is retained and sendable, deliver it to the same
      gateway instance before or alongside the child so the validator can
      resolve it; if it is genuinely unavailable over the link, keep the
      lineage reference rather than dropping it, and honor the `use_limits`
      the warning carries, which prohibit using it as COMMAND_BASIS or
      AUTONOMY_TASKING evidence.
