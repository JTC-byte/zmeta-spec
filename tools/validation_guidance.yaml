structural_rules:
  - id: observation-carries-confidence
    detect:
      event_type: OBSERVATION_EVENT
      has_path: confidence
    hint: >
      This OBSERVATION_EVENT carries a top-level `confidence`, which the schema
      prohibits on observations. Measurements are facts; a judgement about a
      measurement belongs on a later stage. If this number is a detector or
      tracker score, the event is probably not an observation at all: see
      the track-shaped rule below. If it really is an observation, drop the
      score and publish the measurement it was derived from.
    see: spec/semantics-contract.md (event class table), schema/zmeta-event-1.0.schema.json (OBSERVATION_EVENT arm sets confidence:false)

  - id: observation-is-track-shaped
    detect:
      event_type: OBSERVATION_EVENT
      any_path:
        - payload.features.track_id
        - payload.track_id
        - payload.features.heading_deg
        - payload.features.speed_ms
        - payload.features.speed_mps
        - payload.kinematics
        - payload.kinematics.heading_deg
    hint: >
      This payload is track-shaped. It carries identity or kinematics, which
      an observation may not: only a fusion-authorised producer mints a
      track_id. If your sensor does its own detection AND tracking and emits
      finished tracks, the honest class is FUSION_EVENT / TRACK_FUSION, which
      mints `payload.track_id` and REQUIRES envelope `confidence` and
      `lineage`. Picking the right class usually removes several errors at
      once, including the prohibited-confidence error, because the constraint
      was describing the wrong event class rather than a missing feature.
    see: spec/semantics-contract.md (track identity and fusion authority), schema/zmeta-event-1.1.0.schema.json ($defs/FusionPayload)

  - id: external-tracker-needs-promotion
    detect:
      event_type: [FUSION_EVENT, STATE_EVENT]
      absent_path: payload.extensions.external_promotion
      has_path: lineage
    hint: >
      If the track originated in a system outside ZMeta (a foreign tracker, a
      COP, a re-imported projection), it is promoted external state and should
      declare itself as such under `payload.extensions.external_promotion`.
      Undeclared, a foreign track is indistinguishable from one this pipeline
      fused itself. Note that STATE_EVENT may only descend from FUSION_EVENT
      or STATE_EVENT, and `lineage.based_on` requires at least one real event
      id, so an ingested foreign report usually needs a receipt event to cite.
    see: policy/producer-authority.yaml (external_state_promotion), policy/lineage.yaml (allowed_parent_event_types)
    severity_of_hint: consider

  - id: acoustic-missing-required-features
    detect:
      modality: ACOUSTIC
      absent_any_path:
        - payload.features.center_freq_hz
        - payload.features.spl_db
    hint: >
      When `payload.modality` is ACOUSTIC the feature contract requires both
      `center_freq_hz` and `spl_db`. If your sensor is an imaging sonar that
      reports geometry and persistence rather than a characterised signal, it
      may not produce either, and the honest answer is usually that its output
      is a track rather than an acoustic observation. Do not invent a
      frequency or a level to satisfy the contract. Note also that `spl_db` is
      defined against the airborne reference, 20 uPa; underwater work uses
      1 uPa, so state your reference if you report a level.
    see: schema/zmeta-event-1.1.0.schema.json (ACOUSTIC feature contract)

  - id: negative-altitude-as-depth
    detect:
      negative_alt_m: true
    hint: >
      `alt_m` is height above the WGS-84 ellipsoid and only that. A depth
      below the water surface is not a negative ellipsoid height, and the
      geoid departs from the ellipsoid by up to about 100 m, so writing depth
      here asserts a measurement nobody made. It will pass schema validation
      silently. The declared form is `geo.dimensionality: "2D"` with
      `quality.geo_status: "VERTICAL_UNAVAILABLE"`, keeping depth as a native
      feature under its own name.
    see: spec/semantics-contract.md sections 21.8 and the geo single-reference rule

  - id: timing-quality-absent
    detect:
      event_type: [OBSERVATION_EVENT, INFERENCE_EVENT, FUSION_EVENT, STATE_EVENT, COMMAND_EVENT]
      absent_all_paths:
        - payload.timing_quality
        - payload.quality.timing_quality
    hint: >
      Timing quality is required for these event types in every profile, and
      the required fields are time_source, sync_state, est_error_ms and
      last_sync_ts. Without it a consumer cannot tell a fresh event from a
      stale one and is obliged to treat the timing as unknown. If this stream
      is replayed, this is the field that stops replayed data reading as live.
    see: policy/semantics.yaml (timing_quality), spec/semantics-contract.md (timing quality is mandatory for all profiles)

  - id: timestamp-missing-zulu
    detect:
      naive_timestamp: true
    hint: >
      A timestamp here carries no timezone designator. ZMeta requires a
      trailing Z and gates on the pattern rather than on format inference, so
      a naive local timestamp is rejected outright. Emit UTC with the Z.
    see: schema/zmeta-event-1.1.0.schema.json ($defs/utcDateTime)

  - id: unknown-zmeta-version
    detect:
      unknown_version: true
    hint: >
      This event declares a zmeta_version that does not exist. Published
      versions are 1.0 and the 1.1.0 extension branch. An invented version
      string is the single clearest marker of a private dialect, and it costs
      you branch-level diagnostics: the validator falls back to the
      version-discriminated union and can no longer tell you which branch rule
      you broke.
    see: spec/semantics-contract.md (version branches), schema/ lane files
