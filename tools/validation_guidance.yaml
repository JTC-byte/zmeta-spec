  - code: OBSERVATION_HAS_CLASSIFICATION
    remediation: >-
      An OBSERVATION_EVENT payload must not carry a classification, label,
      class_name, or entity_class field at any nesting depth, because an
      observation is a raw sensor-derived fact and does not carry
      classification, track identity, fused state, or operator belief
      (spec/semantics-contract.md:1020-1021 and 1040-1044;
      policy/semantics.yaml:4-10). No validator path emits this code today;
      the recursive observation denylist reports that condition as
      OBSERVATION_HAS_IDENTITY instead (gateway/src/validators.py:3482-3495),
      so read this entry as the contract rule, not an active runtime test.
      Emit the classification as a separate INFERENCE_EVENT: put the class in
      payload.claim, set payload.inference_type and event.event_subtype to
      CLASSIFICATION, and include payload.model.name, payload.model.version,
      and a top-level confidence in [0.0, 1.0]
      (spec/semantics-contract.md:1063-1069 and 1080-1091). Cite the source
      observation's event_id in both lineage.based_on and payload.based_on,
      because lineage is required on every INFERENCE_EVENT and every
      payload.based_on id must also appear in lineage.based_on
      (schema/zmeta-event-1.1.0.schema.json:80 and 2153-2167;
      gateway/src/validators.py:3824-3832).
    citations:
