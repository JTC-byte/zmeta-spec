      block named in the violation path: under zmeta_version 1.1.0 set
      bearing.frame to "TRUE_NORTH"
      (schema/zmeta-event-1.1.0.schema.json:855-858), while v1.0 producers,
      whose locked bearing object rejects the frame key, set
      payload.quality.bearing_frame to "TRUE_NORTH" instead
      (spec/semantics-contract.md:888-902,
      schema/zmeta-event-1.1.0.schema.json:949-953), and TRUE_NORTH is the
      only valid value for either field. The quality object is payload-scoped,
      so a root-level quality object is schema-invalid and leaves the warn
      firing; warn is the severity ceiling because v1.0 tolerates
      legacy-unlabeled bearings (gateway/src/validators.py:3451-3457,
