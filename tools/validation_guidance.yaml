  - code: EVENT_TYPE_NOT_ALLOWED_FOR_ROLE
    remediation: >-
      This fires when `source.node_role` is absent from the `roles` map in
      `policy/roles.yaml`, when that role's `allowed_event_types` does not
      contain `event.event_type` (EDGE allows only OBSERVATION_EVENT and
      SYSTEM_EVENT), or when a `deny` rule in that file matches the event's
      type, role, and producer. In field traffic the cause is almost always a
      wrong event class rather than a wrong role label, an EDGE node emitting
      STATE_EVENT for what is really a measurement, so the sanctioned fix is
      to emit the class the function honestly produces, because the semantic
      contract forbids raw measurements masquerading as state. Change
      `source.node_role` only when the component genuinely performs that
      logical function, and note that `policy/producer-authority.yaml` gates
      the same event on `source.producer` independently, so a role relabel
      alone lands on PRODUCER_NOT_ALLOWED; if the message names a producer or
      a subtype instead of a role, the rule came from `policy/routing.yaml`
      and `node_role` is not consulted at all.
    citations:
      - "policy/violation-codes.yaml:10-11"
      - "gateway/src/validators.py:2972-3019"
      - "policy/roles.yaml:1-34"
      - "spec/semantics-contract.md:499-514"
      - "spec/semantics-contract.md:516-537"
      - "policy/producer-authority.yaml:1-9"
      - "policy/producer-authority.yaml:122-182"
