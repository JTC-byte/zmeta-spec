  - code: INVALID_QUALITY_BEARING_FRAME
    remediation: >-
      quality.bearing_frame is a frame-provenance assertion about the
      canonical bearing and permits exactly the value TRUE_NORTH, so any other
      value, including a sensor-native frame label such as MAGNETIC, fails
      this check on any event type and under either zmeta_version. Convert an
      array-relative, platform-relative, or magnetic angle to true north
      before emitting it as bearing.az_deg and only then assert
      quality.bearing_frame: "TRUE_NORTH"; if it cannot be converted, omit the
      canonical bearing and the quality.bearing_frame assertion and carry the
      raw angle in an explicitly named payload-scoped field that cannot be
      confused with a canonical bearing. Do not add bearing.frame under
      zmeta_version 1.0, whose locked bearing object rejects that key;
      bearing.frame exists only under 1.1.0, whose schema also pins
      quality.bearing_frame to TRUE_NORTH on observation payloads, so a bad
      label there is rejected as SCHEMA_INVALID before this check runs.
