      correction, reinterpretation, refinement, or increase in confidence,
      TTL, precision, or specificity must be emitted as a new event with a
      freshly minted UUIDv7 `event.event_id` plus a `lineage.based_on`
      reference back to the prior event (spec/semantics-contract.md:441-443,
      :468-471, :475-477, :966-967, :1435). Preserving the original `event_id`
      is sanctioned only for a profile export that adds no semantics, and even
      that projection trips this check on a node that already recorded the
      original (spec/semantics-contract.md:456-466).
