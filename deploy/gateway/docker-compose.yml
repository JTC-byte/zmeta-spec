services:
  zmeta-gateway:
    image: python:3.13-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r /app/gateway/requirements.txt
      && python /app/gateway/src/gateway.py --config /app/configs/gateway-config.json"
    volumes:
      - ../..:/app:ro
    ports:
      - "5555:5555/udp"
      - "6969:6969/udp"
