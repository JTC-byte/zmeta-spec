tool_versions:
  python: 3.14.0
  builder: tools/build_release_manifest.py
  validator: tools/validate_release_manifest.py
git_commit: explicit_release_input_required
branch: main
generated_by: tools/build_release_manifest.py
notes:
- Formal release manifest; the committed copy cannot embed its own release commit hash (structural circularity), so commit provenance is carried by the annotated tag, the publication record, and SHA256SUMS_<version>.txt (spec/release-hash-policy.md).
- git_commit and branch use stable placeholders by default; release generation must pass explicit metadata (see spec/release-hash-policy.md provenance rules).
- The semantic contract hash is narrow and does not include implementation artifacts.
- Protobuf is classified as an experimental encoding projection, not v1.0 semantic authority.
- Release manifest validation is opt-in and does not change default strict conformance.
known_open_issues: []
