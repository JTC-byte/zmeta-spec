schema_id: vendor:edge_comms_bladerf:v1
zmeta_event_type: OBSERVATION_EVENT
zmeta_event_subtype: RF

# Deployment-supplied identity (not present on the native detection).
source:
  platform_id: deployment.platform_id
  node_role: EDGE
  producer: rf-sensor-bladerf
  sensor_id: input.metadata.zmeta_sensor_id

event:
  ts: input.timestamp_ms  # normalize to UTC-Z

payload:
  modality: RF
  # Canonical geo is all-or-nothing (contract 6.8). Omit when sensor_lat/lon
  # are null or null-island (0,0); do not invent coordinates.
  geo.lat: input.sensor_lat
  geo.lon: input.sensor_lon
  geo.alt_m: input.sensor_alt_m
  # Canonical bearing is NOT emitted by this pack. The native bearing is
  # heading-derived (uas heading + fixed antenna offset) and the source
  # asserts no reference frame (metadata.heading_source "interpolated"
  # names a sampling method, not a frame). Per contract 6.4 and
  # adapters/AUTHORING.md rule 2, without a producer frame assertion the
  # native values stay under explicitly named non-canonical features and
  # payload.bearing is omitted — in BOTH cases. A deployment that can
  # assert TRUE_NORTH for its heading source may emit bearing.az_deg with
  # quality.bearing_frame TRUE_NORTH + quality.heading_source, mirroring
  # the kraken reference.
  features.native_bearing_deg: input.bearing_deg
  features.native_bearing_error_deg: input.bearing_error_deg
  features.bearing_source: input.metadata.bearing_source
  features.heading_source_native: input.metadata.heading_source
  features.uas_heading_deg: input.metadata.uas_heading_deg
  features.center_freq_hz: input.center_freq_hz
  features.bandwidth_hz: input.bandwidth_hz
  features.power_dbm: input.power_dbm
  features.snr_db: input.snr_db
  features.noise_floor_dbm: input.noise_floor_dbm
  features.detection_id: input.detection_id
  features.sensor_hw: input.metadata.sensor_hw
  features.source: input.metadata.source
  features.source_topic: input.metadata.source_topic
  features.timestamp_source: input.metadata.timestamp_source
  features.fft_bin: input.metadata.fft_bin
  features.fft_size: input.metadata.fft_size
  features.bin_width_hz: input.metadata.bin_width_hz
  features.sample_rate_hz: input.metadata.sample_rate_hz
  features.fft_center_freq_hz: input.metadata.fft_center_freq_hz
  features.orbit_spectrum_bin: input.metadata.orbit_spectrum_bin
  features.orbit_spectrum_bins: input.metadata.orbit_spectrum_bins
  quality.snr_db: input.snr_db
  quality.geo_status: UNAVAILABLE  # when geo omitted
  quality.calibration_state: UNCALIBRATED
  # quality.measurement_error is not emitted: the native bearing_error_deg
  # declares no statistical metric, and no canonical bearing is emitted to
  # qualify. The raw bound travels as features.native_bearing_error_deg.
  timing_quality: degraded_fallback  # UNKNOWN / UNSYNCED unless source PTP/GPS

# Original sensor observations omit lineage (contract 4.8). When an adapter
# translates with real parent event ids, stamp:
#   lineage.transform: translate:vendor:edge_comms_bladerf:v1@1.0.0
#   lineage.based_on: <caller-supplied UUIDv7 parents>
